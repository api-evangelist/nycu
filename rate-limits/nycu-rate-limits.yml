specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: National Yang Ming Chiao Tung University
providerId: nycu
created: '2026-06-03'
modified: '2026-09-01'
reconciled: false
tags:
- Education
- Higher Education
- University
- Rate Limiting
description: >-
  National Yang Ming Chiao Tung University publishes no rate-limit table for any of its surfaces,
  and neither the OAuth documentation nor the terms of service mention throttling. The two
  OAI-PMH endpoints may throttle large harvests; both advertise gzip/deflate compression and the
  NYCU Dataverse robots.txt disallows all crawling, so harvest through the OAI-PMH protocol rather
  than by crawling the web UI. Corrected 2026-09-01 — the previous description named IIIF and
  library endpoints that were never measured on this institution.
notes: >-
  No published limit was found on any NYCU surface. Confirm per-service limits with each
  service; harvest responsibly. dataverse.lib.nycu.edu.tw/robots.txt is User-agent * / Disallow /.
sources:
- https://raw.githubusercontent.com/api-evangelist/nycu/refs/heads/main/apis.yml
responseCodes:
  throttled: 429
limits:
- name: Default
  scope: client
  metric: requests-per-minute
  limit: see service documentation
  notes: No published global limit; large harvests may be rate-limited.
policies:
- name: Backoff Strategy
  description: Exponential backoff with jitter; honor Retry-After; harvest during off-peak hours.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
