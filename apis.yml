aid: nycu
name: National Yang Ming Chiao Tung University
x-type: university
x-category: Public Research University
description: 'National Yang Ming Chiao Tung University (NYCU) is a public research university in Hsinchu
  and Taipei, Taiwan, formed in 2021 from the merger of National Yang-Ming University and National Chiao
  Tung University. Its programmable footprint is small but genuinely its own in one place: the NYCU OAuth
  service at id.nycu.edu.tw, an OAuth 2.0 (RFC 6749) authorization server run by the university''s Information
  Technology Service Center that lets approved applications authenticate NYCU single sign-on users and
  read three consented identity attributes. It is documented publicly, in Chinese and English, with its
  own terms of service and issue tracker, and it is the only contract in this repo NYCU actually engineered.
  Everything else is a relationship rather than an interface the university wrote. NYCU self-hosts a Dataverse
  research-data repository and a DSpace institutional repository on its own network, and both expose an
  anonymous OAI-PMH 2.0 harvesting endpoint that is institution-operated — but the REST contracts underneath
  them belong to the Dataverse Project and DSpace, not to NYCU. Library discovery is an Ex Libris Primo
  tenancy. NYCU is a DataCite direct member in its own name, minting DOIs on prefix 10.57770 through its
  "NYCU Research Data Service" repository, and is registered in ROR. There is no central developer portal,
  no open-data portal, no course or timetable API, no OpenID Connect discovery document, and no publicly
  discoverable Shibboleth or SAML identity provider. The course registration and timetable systems are
  human web applications behind institutional login.'
