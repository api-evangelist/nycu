apis:
- aid: nycu:dataverse-oai-pmh
  name: NYCU Dataverse OAI-PMH Endpoint
  x-operator: institution
  x-operator-evidence: >-
    dataverse.lib.nycu.edu.tw resolves to 140.113.39.17, inside NYCU's own allocation, and the OAI-PMH
    Identify response names NYCU as the repository with adminEmail cyliu+libdv@lib.nycu.edu.tw. OAI-PMH
    is an open protocol rather than a vendor contract, so the endpoint is the institution's even though
    the software serving it is the Dataverse Project's.
  description: >-
    Anonymous OAI-PMH 2.0 metadata-harvesting endpoint over the NYCU Dataverse research-data repository
    ("NYCU Dataverse Dataverse OAI Archive"). Verified with verb=Identify on 2026-09-01. Serves Datacite,
    oai_dc, oai_ddi, oai_datacite and dataverse_json metadata formats, and publishes named sets including
    all_nycu ("All NYCU datasets"). The baseURL below is the OAI-PMH protocol base URL; per the protocol
    it requires a verb, and a bare GET on it returns 500 rather than a 400 badVerb error.
  humanURL: https://dataverse.lib.nycu.edu.tw/
  baseURL: https://dataverse.lib.nycu.edu.tw/oai
