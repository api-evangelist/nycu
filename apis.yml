apis:
- aid: nycu:oauth
  name: NYCU OAuth / Single Sign-On API
  description: >-
    OAuth 2.0 (RFC 6749) authorization-code service for third-party applications to authenticate NYCU
    users and retrieve consented user data (email/username via the profile scope, name via the name scope,
    and enrollment/employment status via the status scope). Apps register a client and redirect-URI whitelist
    before use.
  humanURL: https://id.nycu.edu.tw/docs/
  baseURL: https://id.nycu.edu.tw
  tags:
  - Identity
  - Authentication
  - SSO
