- aid: nycu:dataverse
  name: NYCU Dataverse (Dataverse Project deployment)
  x-operator: tenant
  x-operator-evidence: >-
    The repository is NYCU's — its host, its network, its library's administrators, its DOIs, its 290
    datasets. The REST contract is not: /openapi returns the Dataverse Project v5.10.1 machine-generated
    description, identical in shape to every other Dataverse installation. Twenty-three per-tag OpenAPIs
    split from that document were removed from this repo on 2026-09-01 because they credited the Dataverse
    Project's engineering to NYCU.
  description: >-
    NYCU Dataverse, the university library's research-data repository — a self-hosted deployment of Dataverse
    Project v5.10.1 holding 290 published datasets under DOI prefix 10.57770. Institution-operated data
    on a third party's contract: the Native and Search REST APIs are Dataverse's, documented in the Dataverse
    guides, and are recorded here as a relationship rather than as an NYCU interface. The OAI-PMH endpoint
    over the same repository IS the institution's and is listed separately.
  humanURL: https://dataverse.lib.nycu.edu.tw/
  baseURL: https://dataverse.lib.nycu.edu.tw
