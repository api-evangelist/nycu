  detail: 'Re-profiled 2026-09-01 under the university pipeline''s operator axis. NYCU operates exactly
    one contract of its own — the OAuth 2.0 service at id.nycu.edu.tw — plus two anonymous OAI-PMH 2.0
    endpoints on its own network. The 23 OpenAPIs previously held here were per-tag splits of ONE document,
    the Dataverse Project v5.10.1 machine-generated description captured from dataverse.lib.nycu.edu.tw/openapi;
    they were removed with everything derived from them because they credited the Dataverse Project''s
    engineering to the university. The repository, the DSpace institutional repository and the Ex Libris
    Primo discovery layer are kept as tenant relationships, and the DataCite and ROR registrations as
    registry memberships, because those are real facts about the institution even where the contract is
    not theirs. Hunted and not found: a developer portal (developer.nycu.edu.tw, api.nycu.edu.tw — no
    DNS), an open-data portal (data.nycu.edu.tw, opendata.nycu.edu.tw — no DNS), a course or timetable
    API (timetable.nycu.edu.tw and course.nycu.edu.tw are human web applications, the latter behind reCAPTCHA
    and Big5-encoded), a Shibboleth or SAML IdP (idp./sso./shibboleth.nycu.edu.tw — no DNS; id.nycu.edu.tw/saml/metadata
    404), an OAuth/OIDC discovery document (both well-known paths 404), a Crossref membership (0 results),
    and any ORCID integration. Searched in Traditional Chinese as well as English; the OAuth documentation,
    terms of service and the university''s generative-AI guidelines are all Chinese-first surfaces.'
