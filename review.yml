  - date: '2026-09-01'
    rating: 2
    summary: >-
      Re-reviewed under the API Evangelist university pipeline's operator axis. The June
      review was right about what was live and wrong about who operates it. NYCU operates
      exactly one contract of its own — the OAuth 2.0 service at id.nycu.edu.tw, run by the
      Information Technology Service Center, with its own docs, its own terms of service
      (last updated 2025-10-28), its own GitHub org (NYCU-OAuth) and six documented
      endpoints — plus two anonymous OAI-PMH 2.0 harvesting endpoints on its own network.
      The 23 OpenAPIs this repo previously held were per-tag splits of ONE document, the
      Dataverse Project v5.10.1 machine-generated description, and they credited the
      Dataverse Project's engineering to the university; they and everything derived from
      them were removed. Newly found and recorded: a self-hosted DSpace 11 institutional
      repository (機構典藏) with content back to 2014 and its own OAI-PMH endpoint, an Ex
      Libris Primo library tenancy (886UST_NYCU), a DataCite DIRECT MEMBERSHIP in NYCU's own
      name (provider gtfe, repository client gtfe.kagikv, prefix 10.57770, 290 datasets),
      and a ROR registration. Not found despite hunting: developer portal, open-data portal,
      course/timetable API, Shibboleth or SAML IdP, OAuth/OIDC discovery document, Crossref
      membership, ORCID integration. Defect worth naming on an otherwise well-run service:
      the OAuth resource endpoints answer an unauthenticated request with a Django HTTP 500
      page instead of an RFC 6750 401. The rating drops because the profile is now honest,
      not because the university changed.
    endpoints:
