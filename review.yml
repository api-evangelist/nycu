  - date: '2026-06-03'
    rating: 3
    summary: >-
      Verified live: NYCU operates a documented OAuth 2.0 single sign-on developer
      service at id.nycu.edu.tw with public docs and an app-registration flow, plus an
      NYCU Dataverse research-data repository (Dataverse v5.10.1) exposing the standard
      Native/Search REST APIs (api/info/version returns 200) and an OAI-PMH 2.0 endpoint
      (verb=Identify returns the "NYCU Dataverse Dataverse OAI Archive"). No official
      institution-wide GitHub org was found (only individual research-lab orgs such as
      ARG-NCTU and NYCU-NLP-Lab); course/timetable/SIS and portal systems are gated
      behind SSO and not openly documented. The institution website returns 403 to
      automated clients and LinkedIn returns 999 (both standard bot-blocking, sites
      exist). No fabricated endpoints; only confirmed URLs reported.
