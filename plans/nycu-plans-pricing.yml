description: >-
  National Yang Ming Chiao Tung University is a non-commercial higher-education institution; its
  APIs are not sold as a commercial product and there is no published pricing of any kind. The
  two anonymous OAI-PMH harvesting endpoints (NYCU Dataverse, NYCU institutional repository) are
  open at no charge. The university's own OAuth service is free but not self-service: a client
  must be registered, and the two sensitive scopes must be approved by the Information Technology
  Service Center, which in principle grants them only to systems the university develops or
  operates. Course, timetable and administrative systems are behind institutional SSO and are not
  APIs. Corrected 2026-09-01 — the previous description named library, course and IIIF interfaces
  that were never measured on this institution.
notes: >-
  No published per-seat or per-call commercial pricing. "Free / Open" reflects open
  public endpoints; "Affiliation / Credentialed" reflects access gated by institutional
  identity rather than payment.
sources:
- https://raw.githubusercontent.com/api-evangelist/nycu/refs/heads/main/apis.yml
